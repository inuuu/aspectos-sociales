const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const LET = 'ABCDEFGHIJ';
const isParcial = q => norm(q.fuente) === 'parcial';
const unidades = () => [...new Set(PREGUNTAS.map(q => q.unidad))].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));

const REL_RE = /^(vincul[aá]|elegir la opci[oó]n correcta para cada)/i;
const itemsRel = q => { const t = q.pregunta, i = t.indexOf(': '); return (i >= 0 ? t.slice(i + 2) : t).split(' / ').map(s => s.replace(/^\d+\)\s*/, '').trim()).filter(Boolean); };

function tipoDe(q) {
  if (q.tipo) return q.tipo;
  if (q.opciones.length === 1) return 'abierta';
  if (Array.isArray(q.correcta)) {
    if (REL_RE.test(q.pregunta.trim()) && itemsRel(q).length === q.correcta.length) return 'relacionar';
    return 'multiple';
  }
  return 'simple';
}

function prep(q) {
  const tipo = tipoDe(q);
  const order = tipo === 'abierta' ? q.opciones.map((_, i) => i) : shuffle(q.opciones.map((_, i) => i));
  const r = { q, tipo, opts: order.map(i => q.opciones[i]) };
  if (tipo === 'simple') r.ok = new Set([order.indexOf(q.correcta)]);
  else if (tipo === 'multiple') r.ok = new Set(q.correcta.map(c => order.indexOf(c)));
  else if (tipo === 'relacionar') { r.items = itemsRel(q); r.stem = q.pregunta.split(': ')[0]; r.map = q.correcta.map(c => order.indexOf(c)); }
  return r;
}

        </button>

  </div>`;
}

function optHTML(r, k) {
  const multi = r.tipo === 'multiple';
  const sel = multi ? S.sel.has(k) : S.sel === k, ok = r.ok.has(k);
  let cls = '', badge = '', tag = '';

  if (!S.done) {
    if (sel) {
      cls = 'border-amber-400 bg-amber-500/15 shadow-md shadow-amber-500/5';
      badge = 'border-amber-400 bg-amber-400 text-ink font-semibold';
    } else {
      cls = 'border-line bg-panel/75 hover:border-amber-400/50 hover:bg-panelHover';
      badge = 'border-line bg-ink/70 text-mute group-hover:text-paper group-hover:border-amber-400/40';
    }
    if (multi) {
      tag = `<span class="ml-auto pl-2"><span class="w-5 h-5 rounded-md border grid place-items-center text-xs ${sel ? 'border-amber-400 bg-amber-400 text-ink font-bold' : 'border-line bg-ink/50 text-transparent'}">✓</span></span>`;
    }
  } else if (ok && (sel || !multi)) {
    cls = 'border-emerald-500/80 bg-emerald-500/15 shadow-md shadow-emerald-950/30';
    badge = 'border-emerald-400 bg-emerald-400 text-ink font-bold';
    tag = '<span class="ml-auto pl-3 shrink-0 inline-flex items-center gap-1 text-emerald-300 text-xs font-mono uppercase tracking-wider bg-emerald-500/20 px-2.5 py-1 rounded-full border border-emerald-400/30">✓ Correcta</span>';
  } else if (ok) {
    cls = 'border-emerald-500/70 border-dashed bg-emerald-500/10';
    badge = 'border-emerald-400 text-emerald-300 font-semibold';
    tag = '<span class="ml-auto pl-3 shrink-0 inline-flex items-center gap-1 text-emerald-300 text-xs font-mono bg-emerald-500/15 px-2.5 py-1 rounded-full border border-emerald-400/30">Faltó marcar</span>';
  } else if (sel) {
    cls = 'border-rose-500/80 bg-rose-500/15';
    badge = 'border-rose-400 bg-rose-400 text-ink font-bold';
    tag = '<span class="ml-auto pl-3 shrink-0 inline-flex items-center gap-1 text-rose-300 text-xs font-mono uppercase tracking-wider bg-rose-500/20 px-2.5 py-1 rounded-full border border-rose-400/30">✕ Tu elección</span>';
  } else {
    cls = 'border-line/40 bg-panel/30 opacity-50';
    badge = 'border-line/50 text-mute/60';
  }

  return `<button data-opt="${k}" ${S.done ? 'disabled' : ''} class="opt-card group w-full text-left flex items-start gap-3.5 px-4 py-3.5 rounded-2xl border ${cls}">
    <span class="shrink-0 w-7 h-7 grid place-items-center rounded-lg border font-mono text-xs transition-colors ${badge}">${LET[k] || k + 1}</span>
    <span class="flex-1 leading-relaxed text-sm sm:text-base pt-0.5 text-paper/95">${esc(r.opts[k])}</span>${tag}</button>`;
}

function relHTML(r) {
  return r.items.map((it, i) => {
    const v = S.sel[i], good = v === r.map[i];
    const box = !S.done
      ? 'border-line bg-panel/80'
      : good
        ? 'border-emerald-500/70 bg-emerald-500/10'
        : 'border-rose-500/70 bg-rose-500/10';
    return `<div class="rounded-2xl border p-4 transition ${box}">
      <div class="flex items-start gap-2.5 mb-2.5">
        <span class="shrink-0 w-6 h-6 rounded-md bg-ink/80 border border-line font-mono text-xs text-amber-400 grid place-items-center">${i + 1}</span>
        <p class="leading-snug text-sm sm:text-base font-medium text-paper pt-0.5">${esc(it)}</p>
      </div>
      <select data-rel="${i}" ${S.done ? 'disabled' : ''} class="w-full bg-ink border border-line hover:border-amber-400/50 rounded-xl px-3.5 py-2.5 text-sm text-paper transition">
        <option value="">Seleccioná la opción correspondiente...</option>
        ${r.opts.map((o, k) => `<option value="${k}" ${v === k ? 'selected' : ''}>${LET[k]}. ${esc(o)}</option>`).join('')}
      </select>
      ${S.done && !good ? `<p class="text-xs font-mono text-emerald-300 mt-2.5 flex items-center gap-1.5"><span>✓ Correspondía:</span> <span class="font-sans font-medium">${esc(r.opts[r.map[i]])}</span></p>` : ''}</div>`;
  }).join('');
}

function vExam() {
  const r = S.queue[S.i], q = r.q, tot = S.queue.length, pct = ((S.i + (S.done ? 1 : 0)) / tot) * 100;
  const okCount = S.results.filter(x => x && x.ok).length;
  const failCount = S.results.filter(x => x && !x.ok).length;

  let body;
  if (r.tipo === 'simple' || r.tipo === 'multiple') body = r.opts.map((_, k) => optHTML(r, k)).join('');
  else if (r.tipo === 'relacionar') body = relHTML(r);
  else body = `<input id="open" type="text" autocomplete="off" value="${esc(S.sel)}" ${S.done ? 'disabled' : ''} placeholder="Escribí tu respuesta y presioná Enter..." class="w-full bg-ink/90 border border-line focus:border-amber-400 rounded-2xl px-4 py-3.5 text-base">
    ${S.done ? `<p class="text-sm mt-2.5 font-medium ${S.lastOk ? 'text-emerald-300' : 'text-rose-300'}">Respuesta esperada: <span class="underline decoration-dotted">${esc(r.opts[0])}</span></p>` : ''}`;

  const tipoBadge = {
    simple: ['Opción única', 'bg-white/5 text-mute border-white/10'],

    relacionar: ['Vincular conceptos', 'bg-purple-500/15 text-purple-300 border-purple-500/30'],
    abierta: ['Respuesta corta escrita', 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30']
  }[r.tipo];

  const fuenteBadge = isParcial(q)
    ? 'bg-amber-500/15 text-amber-300 border-amber-500/30'
    : 'bg-sky-500/15 text-sky-300 border-sky-500/30';

  const btn = (act, txt, extra = '') => `<button data-act="${act}" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-ink font-semibold shadow-lg shadow-amber-500/20 transition hover:brightness-110 active:scale-[0.99] ${extra}">${txt}</button>`;

  return `
  <!-- Top Progress Header -->
  <div class="glass-card rounded-2xl p-4 mb-5">
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-mono mb-2.5">
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 rounded-lg bg-ink/80 border border-line text-paper font-semibold">Pregunta ${S.i + 1} / ${tot}</span>
        <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/25 text-emerald-300">✓ ${okCount}</span>
        <span class="px-2.5 py-1 rounded-lg bg-rose-500/10 border border-rose-500/25 text-rose-300">✕ ${failCount}</span>
      </div>
      <button data-act="quit" class="px-2.5 py-1 rounded-lg border border-transparent hover:border-line hover:bg-ink/60 text-mute hover:text-paper transition">
        ✕ Salir al menú

    </div>
    <div class="h-2 rounded-full bg-ink overflow-hidden p-0.5 border border-line/60">
      <div class="h-full rounded-full bg-gradient-to-r from-amber-400 via-amber-500 to-emerald-400 transition-all duration-300" style="width:${pct}%"></div>
    </div>
  </div>

  <!-- Main Question Card -->
  <div id="card" class="glass-card rounded-3xl p-6 sm:p-8 ${S.fresh ? 'fresh' : ''}">
    <!-- Metadata Badges -->
    <div class="flex flex-wrap items-center gap-2 mb-4 text-xs font-mono">
      <span class="px-2.5 py-1 rounded-full border border-line bg-ink/60 text-paper font-medium">${esc(q.unidad)}</span>
      <span class="px-2.5 py-1 rounded-full border ${fuenteBadge}">${esc(q.fuente)}</span>
      <span class="px-2.5 py-1 rounded-full border ${tipoBadge[1]}">${tipoBadge[0]}</span>
      <span class="ml-auto text-mute">#${q.id}</span>
    </div>

    <!-- Question Text -->
    <h2 class="font-serif text-xl sm:text-2xl leading-relaxed text-white font-medium mb-6">${esc(r.tipo === 'relacionar' ? r.stem : q.pregunta)}</h2>

    <!-- Options Container -->
    <div class="space-y-3">${body}</div>

    <!-- Immediate Explanation Feedback -->
    ${S.done ? `
    <div class="fresh mt-6 rounded-2xl border p-5 ${S.lastOk ? 'border-emerald-500/50 bg-gradient-to-br from-emerald-500/15 to-emerald-950/20' : 'border-rose-500/50 bg-gradient-to-br from-rose-500/15 to-rose-950/20'}">
      <div class="flex items-center gap-2.5 mb-2">
        <span class="w-6 h-6 rounded-full grid place-items-center text-xs font-bold ${S.lastOk ? 'bg-emerald-400 text-ink' : 'bg-rose-400 text-ink'}">${S.lastOk ? '✓' : '✕'}</span>
        <p class="font-semibold text-base ${S.lastOk ? 'text-emerald-300' : 'text-rose-300'}">${S.lastOk ? '¡Respuesta correcta!' : 'Respuesta incorrecta'}</p>
      </div>

    </div>` : ''}

    <!-- Card Footer Controls -->
    <div class="flex flex-wrap items-center justify-between gap-3 mt-7 pt-5 border-t border-white/10">
      <p id="msg" class="text-sm font-medium text-amber-300 min-h-[1.25rem]"></p>
      <div class="ml-auto">
        ${S.done
          ? btn('next', `${S.i + 1 >= tot ? 'Ver resultados finales' : 'Siguiente pregunta'} <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>`)
          : (r.tipo === 'simple' ? '<span class="text-xs text-mute">Hacé clic en una opción para responder</span>' : btn('check', 'Comprobar respuesta'))}
      </div>
    </div>
  </div>

  <!-- Keyboard Shortcuts Helper -->
  <div class="hidden sm:flex items-center justify-center gap-4 text-xs text-mute mt-5">
    <span><kbd>1</kbd>–<kbd>9</kbd> o <kbd>A</kbd>–<kbd>I</kbd> marcar opción</span>
    <span>·</span>
    <span><kbd>Enter</kbd> o <kbd>→</kbd> comprobar / siguiente</span>
  </div>`;
}

function vResult() {
  const tot = S.results.length, ok = S.results.filter(r => r.ok).length, pct = tot ? Math.round(ok / tot * 100) : 0;
  const col = pct >= 70 ? '#34d399' : pct >= 50 ? '#eab308' : '#fb7185';
  const statusTxt = pct >= 80 ? '¡Excelente dominio!' : pct >= 60 ? 'Aprobado · Buen ritmo' : 'A repasar los puntos flojos';
  const statusBadge = pct >= 70 ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : pct >= 50 ? 'bg-amber-500/15 text-amber-300 border-amber-500/30' : 'bg-rose-500/15 text-rose-300 border-rose-500/30';

  const by = {};
  S.results.forEach(r => { const u = by[r.q.unidad] ??= { ok: 0, t: 0 }; u.t++; if (r.ok) u.ok++; });
  const rows = Object.keys(by).sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).map(u => {
    const p = Math.round(by[u].ok / by[u].t * 100);
    const c = p >= 70 ? 'from-emerald-400 to-emerald-500' : p >= 50 ? 'from-amber-400 to-amber-500' : 'from-rose-400 to-rose-500';
    return `<div class="bg-ink/50 border border-line/80 rounded-2xl p-4">
      <div class="flex justify-between items-center text-sm mb-2">
        <span class="font-medium text-white">${esc(u)}</span>
        <span class="font-mono text-xs text-mute"><strong class="text-paper">${by[u].ok}</strong> / ${by[u].t} aciertos (${p}%)</span>
      </div>
      <div class="h-2.5 rounded-full bg-ink overflow-hidden border border-line/50">
        <div class="h-full rounded-full bg-gradient-to-r ${c} transition-all duration-500" style="width:${p}%"></div>
      </div>
    </div>`;
  }).join('');

  const fails = tot - ok;
  const failedList = S.results.filter(r => !r.ok);

  return `
  <div class="fresh space-y-6">
    <div class="glass-card rounded-3xl p-6 sm:p-8">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
        <h1 class="font-serif text-3xl text-white font-semibold">Resumen del intento</h1>
        <span class="px-3 py-1 rounded-full text-xs font-mono border ${statusBadge}">${statusTxt}</span>
      </div>

      <!-- Score Hero -->
      <div class="flex flex-col sm:flex-row items-center gap-7 p-6 rounded-2xl bg-ink/60 border border-line mb-8">
        <div class="w-32 h-32 rounded-full grid place-items-center shrink-0 shadow-inner" style="background:conic-gradient(${col} ${pct}%, #1e2434 0)">
          <div class="w-24 h-24 rounded-full bg-ink grid place-items-center">
            <span class="font-mono text-3xl font-bold text-white">${pct}%</span>
          </div>
        </div>
        <div class="text-center sm:text-left space-y-2 flex-1">
          <p class="text-2xl sm:text-3xl font-semibold text-white">${ok} de ${tot} respuestas correctas</p>
          <p class="text-sm text-mute">Respondidas correctamente en esta sesión de práctica.</p>
          <div class="flex flex-wrap justify-center sm:justify-start gap-2 pt-2">
            <span class="px-3 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-mono">✓ ${ok} Aciertos</span>
            <span class="px-3 py-1 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-mono">✕ ${fails} Errores</span>
          </div>
        </div>
      </div>

      <!-- Breakdown by Unit -->
      <h2 class="text-xs font-mono uppercase tracking-wider text-mute mb-3">Desglose de rendimiento por unidad</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">${rows}</div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-3 pt-4 border-t border-white/10">
        ${fails ? `<button data-act="retry" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 text-ink font-semibold shadow-lg shadow-amber-500/20 transition hover:brightness-110">
          <span>Reintentar solo las falladas (${fails})</span>
        </button>` : ''}
        <button data-act="home" class="px-6 py-3 rounded-xl border border-line bg-panel hover:bg-panelHover hover:border-amber-400/50 text-paper font-medium transition">
          Configurar nuevo examen
        </button>
      </div>
    </div>

    ${fails ? `
    <!-- Failed Questions Review Card -->
    <div class="glass-card rounded-3xl p-6 sm:p-8">
      <h2 class="font-serif text-2xl text-white font-semibold mb-1">Repaso rápido de errores (${fails})</h2>
      <p class="text-sm text-mute mb-5">Revisá las explicaciones de las preguntas que fallaste antes de volver a intentarlas.</p>
      <div class="space-y-4">
        ${failedList.map(({ q }) => {
          const corrTxt = Array.isArray(q.correcta)
            ? q.correcta.map(idx => q.opciones[idx]).join(' · ')
            : q.opciones[q.correcta];
          return `<div class="rounded-2xl border border-rose-500/30 bg-ink/50 p-4 sm:p-5">
            <div class="flex items-center gap-2 text-xs font-mono text-mute mb-2">
              <span class="px-2 py-0.5 rounded bg-panel border border-line text-paper">${esc(q.unidad)}</span>
              <span>#${q.id}</span>
            </div>
            <p class="font-serif text-base sm:text-lg text-white mb-2.5">${esc(q.pregunta)}</p>
            <p class="text-xs sm:text-sm text-emerald-300 font-medium mb-2">✓ Respuesta correcta: ${esc(corrTxt)}</p>
            <p class="text-xs sm:text-sm text-mute leading-relaxed border-t border-white/5 pt-2.5">${esc(q.explicacion)}</p>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
  </div>`;
}

function render() {
  $('#app').innerHTML = { config: vConfig, exam: vExam, result: vResult }[S.screen]();
  S.fresh = false;
  if (S.screen === 'exam') { const r = S.queue[S.i]; if (r.tipo === 'abierta' && !S.done) $('#open')?.focus(); }
}

/* ---------- Lógica ---------- */
function initSel() {
  const r = S.queue[S.i];
  S.sel = r.tipo === 'simple' ? null : r.tipo === 'multiple' ? new Set() : r.tipo === 'relacionar' ? Array(r.items.length).fill(null) : '';
  S.done = false; S.fresh = true;
}
function begin(qs) { S.queue = shuffle(qs).map(prep); S.i = 0; S.results = []; S.screen = 'exam'; initSel(); render(); window.scrollTo({ top: 0 }); }
function start() { const p = pool(S.cfg); if (!p.length) return; const n = S.cfg.n === 'all' ? p.length : Math.min(S.cfg.n, p.length); begin(shuffle(p).slice(0, n)); }
function retry() { begin(S.results.filter(r => !r.ok).map(r => r.q)); }
function home() { S.screen = 'config'; render(); window.scrollTo({ top: 0 }); }
function quit() { if (confirm('¿Salir al menú principal? Se perderá el progreso de este intento.')) home(); }
function next() {
  if (!S.done) return;
  if (S.i + 1 >= S.queue.length) { S.screen = 'result'; render(); window.scrollTo({ top: 0 }); return; }
  S.i++; initSel(); render(); window.scrollTo({ top: 0 });
}
function msg(t) { const m = $('#msg'); if (m) { m.textContent = t; setTimeout(() => { if (m.textContent === t) m.textContent = ''; }, 2500); } }

function comprobar() {
  if (S.done) return;
  const r = S.queue[S.i]; let ok = false;
  if (r.tipo === 'simple') { if (S.sel === null) return; ok = r.ok.has(S.sel); }
  else if (r.tipo === 'multiple') { if (!S.sel.size) return msg('⚠️ Marcá al menos una opción antes de comprobar.'); ok = S.sel.size === r.ok.size && [...S.sel].every(k => r.ok.has(k)); }
  else if (r.tipo === 'relacionar') { if (S.sel.some(v => v === null)) return msg('⚠️ Completá todos los desplegables antes de comprobar.'); ok = S.sel.every((v, i) => v === r.map[i]); }
  else { const t = norm(S.sel), a = norm(r.opts[0]); if (!t) return msg('⚠️ Escribí una respuesta antes de comprobar.'); ok = t === a || t.includes(a); }
  S.done = true; S.lastOk = ok; S.results[S.i] = { q: r.q, ok }; render();
}
function elegir(k) {
  if (S.done) return;
  const r = S.queue[S.i];
  if (r.tipo === 'simple') { S.sel = k; comprobar(); }
  else if (r.tipo === 'multiple') { S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k); render(); }
}

/* ---------- Eventos ---------- */
const app = $('#app');
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.g) { S.cfg[b.dataset.g] = (b.dataset.g === 'n' && b.dataset.v !== 'all') ? +b.dataset.v : b.dataset.v; render(); }
  else if (b.dataset.opt !== undefined) elegir(+b.dataset.opt);
  else if (b.dataset.act) ({ start, check: comprobar, next, retry, home, quit })[b.dataset.act]();
});
app.addEventListener('change', e => { const t = e.target; if (t.dataset.rel !== undefined) S.sel[+t.dataset.rel] = t.value === '' ? null : +t.value; });
app.addEventListener('input', e => { if (e.target.id === 'open') S.sel = e.target.value; });

document.addEventListener('keydown', e => {
  if (S.screen !== 'exam' || e.ctrlKey || e.metaKey || e.altKey) return;
  const r = S.queue[S.i], tag = document.activeElement.tagName, typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  if (e.key === 'Enter' || e.key === 'ArrowRight') {
    if (e.key === 'ArrowRight' && typing) return;
    e.preventDefault(); S.done ? next() : comprobar(); return;
  }
  if (typing || S.done || !(r.tipo === 'simple' || r.tipo === 'multiple')) return;
  let k = -1;
  if (/^[1-9]$/.test(e.key)) k = +e.key - 1;
  else if (/^[a-jA-J]$/.test(e.key)) k = LET.indexOf(e.key.toUpperCase());
  if (k >= 0 && k < r.opts.length) elegir(k);
});

render();
</script>
